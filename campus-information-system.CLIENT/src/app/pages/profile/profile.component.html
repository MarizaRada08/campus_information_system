<div class="profile-section" *ngIf="student">
  <h2>Profile Information</h2>

  <div class="profile-card">
    <div class="profile-header">
      <img src="assets/images/Profile.jpg" alt="User" class="profile-img" />
      <div class="profile-name">
        <h3>{{ student.FirstName }} {{ student.LastName }}</h3>
        <p>{{ student.Email }}</p>
      </div>
    </div>

    <form>
      <div class="form-grid">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" [value]="student.FirstName" readonly />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" [value]="student.LastName" readonly />
        </div>
        <div class="form-group">
          <label>Middle Name</label>
          <input type="text" [value]="student.MiddleName" readonly />
        </div>
        <div class="form-group">
          <label>Gender</label>
          <input type="text" [value]="student.Gender" readonly />
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" [value]="student.DateOfBirth | date:'yyyy-MM-dd'" readonly />
        </div>
        <div class="form-group">
          <label>Age</label>
          <input type="number" [value]="student.Age" readonly />
        </div>
        <div class="form-group">
          <label>Grade Level</label>
          <input type="text" [value]="student.GradeLevel" readonly />
        </div>
        <div class="form-group">
          <label>Section</label>
          <input type="text" [value]="student.Section" readonly />
        </div>
        <div class="form-group">
          <label>Address</label>
          <input type="text" [value]="student.Address" readonly />
        </div>
        <div class="form-group">
          <label>Contact Number</label>
          <input type="text" [value]="student.ContactNumber" readonly />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [value]="student.Email" readonly />
        </div>
      </div>

      <h4>Parent/Guardian Information</h4>
      <div class="form-grid">
        <div class="form-group">
          <label>Guardian Name</label>
          <input type="text" [value]="student.GuardianName" readonly />
        </div>
        <div class="form-group">
          <label>Guardian Contact</label>
          <input type="text" [value]="student.GuardianContact" readonly />
        </div>
      </div>
    </form>
  </div>
</div>
